model: nvidia/canary-ctc-aligner
base:
  - key: cstr/canary-ctc-aligner
    role: model
    defaultFile: canary-ctc-aligner-q4_k.gguf
    sources:
      - type: huggingface
        user: cstr
        repo: canary-ctc-aligner-GGUF
        files: [{name: canary-ctc-aligner-q4_k.gguf, size: 442 MB}]
  - key: ggml-org/silero-vad
    role: vad
    defaultFile: ggml-silero-v6.2.0.bin
    sources:
      - type: huggingface
        user: ggml-org
        repo: whisper-vad
        files: [{name: ggml-silero-v6.2.0.bin, size: 1 MB}]
metadataOverrides: {domain: stt, architectures: [canary-ctc], compatibilityTypes: [gguf], capabilities: [forced-alignment]}
laStudio:
  id: canary-ctc-aligner
  type: stt
  localDir: canary-ctc-aligner
  shortName: Canary CTC
  title: Canary CTC Aligner
  subtitle: FastConformer CTC alignment for European languages
  description: CrispASR Canary auxiliary CTC forced aligner with Silero VAD.
  accent: "#27a99a"
  capabilities: [forced-alignment]
  tags: [GGUF, CTC, Offline]
  runtimes:
    - {id: crispasr-win-x86_64-cpu, engineFamily: crispasr, label: CPU, name: CPU CrispASR (x64), asset: libcrispasr-windows-x86_64.tar.gz, version: v0.8.13, source: "https://github.com/CrispStrobe/CrispASR/releases/download/", library: bin/crispasr.dll, backend: canary-ctc, pipelineProfile: crispasr-anchor-align}
  studio:
