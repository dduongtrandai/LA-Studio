  title: Spleeter 2-stem FP16
  subtitle: Fast voice isolation for sherpa-onnx
  description: Fast local two-stem source separation using the sherpa-onnx Spleeter FP16 vocals and accompaniment models.
  accent: "#7c4dff"
  capabilities:
    - voice-isolation
