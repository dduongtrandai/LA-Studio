        files:
          - name: m2m100-418m-q8_0.gguf
            size: 502 MiB
          - name: m2m100-418m-f16.gguf
metadataOverrides:
  domain: stt
  architectures: [m2m100]
  compatibilityTypes: [gguf]
  capabilities: [stt]
laStudio:
  id: m2m100-418m
  type: stt
  localDir: m2m100-418m
  shortName: M2M
  title: M2M-100 418M
  subtitle: Offline multilingual text translation for dubbing
  description: Local text-to-text translation through the CrispASR M2M-100 backend. Supports 100 languages in any-to-any directions.
  accent: "#27a99a"
  capabilities: [stt]
  supportsStt: true
  tags: [GGUF, Offline, Translation, Dubbing]
